# Farm Radar の設定ファイル。閾値や間隔はすべてここで変えられます。

# 動作モード: observe（観察のみ） / paper（ペーパートレード）
# それ以外の値を書くと起動時にエラーで止まります。
mode: observe

database:
  path: data/farm_radar.sqlite3

# ジョブの間隔（分）。60を割り切れる値にすると、毎時0分・15分…のようにきれいに揃います。
schedule:
  snapshot_minutes: 15

rpc:
  # 1つのRPCへの再試行回数と、待ち時間（秒・指数的に伸びる）
  max_retries: 3
  backoff_seconds: 1.0
  timeout_seconds: 15
  # 予備のRPC（公開RPCの後に順番に試す）。.env の EXTRA_RPC_URLS も追加されます。
  extra_urls: []
  # "latest" ブロックを指定した読み取りのキャッシュ秒数（固定ブロックの読み取りは常にキャッシュ）
  latest_cache_seconds: 5

# 有効にする会場（venues/<id>.yaml）
venues:
  - up-robinhood

# データがこの分数より古ければ「データ古い」とみなす
stale_after_minutes: 45

# 報酬データの扱い
rewards:
  # エポック切り替え（木曜 09:00 JST）からこの分数までのデータに「エポック更新直後」の印を付ける。
  epoch_fresh_minutes: 120

# 通知の条件（記録はデータベースの alerts 表。送信は下の notify）
alerts:
  # エポックの途中で、報酬の毎秒量がそのエポックの最大値からこの%以上減ったら記録する
  reward_rate_drop_pct: 30

# 通知（M4。SPEC 8章）。送り先は Telegram。トークンとあなたのIDは .env にだけ書きます
# （TELEGRAM_BOT_TOKEN / TELEGRAM_OWNER_ID。書いていなければ送らず、記録だけします）
# 送るもの: 新しく🟢になった / 🟢から🔴に落ちた / 報酬がエポックの途中で減った / 収集や計算のエラー / 毎朝のレポート
notify:
  daily_report_time_jst: "08:00"   # 毎朝のレポートの時刻（日本時間）
  daily_report_top: 5              # レポートに載せる上位の件数
  error_repeat_minutes: 60         # 同じエラーは、この分数に1回だけ知らせる
  max_age_hours: 24                # これより古いお知らせは送らない（パソコンを長く止めていたとき用）
  send_every_minutes: 1            # 送っていないお知らせを確かめる間隔（分）

# スコアの計算（SPEC 3.2章）。1時間ごとに全プールを計算して判定する。
scoring:
  every_minutes: 60
  # 総資産（ドル）と、その振り分け（LPに置く額・ヘッジの証拠金・予備）。合計は1にする
  total_capital_usd: 1000
  allocation: {lp: 0.55, hedge_margin: 0.40, reserve: 0.05}
  # 試すレンジ幅（片側の%。±1% なら 1）
  ranges_pct: [0.5, 1, 2, 3, 5, 10, 15]
  # レンジを外れてから置き直すまでの待ち時間（分）。レンジ内の時間の割合の計算に使う（2026-09-29 オーナー決定: 初期値15分）
  rebalance_wait_minutes: 15
  # 置き直しの費用: 1回の取引のガスの量（ガス代はRPCのガス価格 × この量 × ETHの価格）、両替する割合
  gas_units_per_tx: 600000
  swap_ratio: 0.5
  # 両替のずれ（スリッページ）。プールの今の流動性から「この金額を両替したら価格がどれだけ動くか」を計算する
  # （2026-09-29 オーナー指示）。計算できないときだけ下の初期値を使う
  slippage:
    trade_usd: null                    # 見積もる金額（ドル）。null = LPに置く額（今は $550）
    fallback_stable_stock_pct: 0.1     # ステーブルコインと株トークンだけのプール
    fallback_other_pct: 1.0            # それ以外
  # 1日の取引量がプールのTVLのこの倍を超えたら「取引量が不自然に多い（見せかけの取引の可能性）」と警告し、
  # 手数料の収入は0として計算する（2026-09-29 オーナー決定。前の「TVLの10倍までに抑える」ルールを置き換え）
  volume_suspicious_tvl_multiple: 10
  # 参考値「報酬をすぐ売る前提の純日利」: 報酬を受け取ってから売るまでの時間（時間）。
  # 報酬トークンの値下がりを、7日の傾向ではなくこの時間の分だけ引く。判定には使わない（2026-09-29 オーナー指示）
  reward_sell_hours: 1
  hedge:
    # perp（Lighter）の取引手数料（%）。標準アカウントは0。出典と確認日は venues/lighter.yaml
    taker_fee_pct: 0.0
    # 資金調達を受け取る側のとき、それを収入に数えるか（false = 数えない。安全側）
    count_funding_income: false
  # 値動き σ を計算する日数。自分の記録がこれに足りない間は GeckoTerminal の1時間足で補う
  volatility_days: 7
  # GeckoTerminal の1時間足を取り直す間隔（時間）。1分30回までの制限があるため
  external_refresh_hours: 3

# 判定（信号機）の基準（SPEC 4章）。純日利は総資産あたりの%
signal:
  green_min_pct: 0.30
  yellow_min_pct: 0.10
  green_min_tvl_usd: 200000
  # 報酬トークンが7日でこの%以上下がっていたら重大な警告（🔴）
  reward_token_7d_major_pct: -30
  # 純日利がこの%を超えたら「数字が高すぎます」の警告を付ける（軽微な警告なので最高でも🟡）
  too_high_pct: 5.0

# 練習の建玉の見張り（M5b。SPEC 12.2章・付録A 3章の初期値）。15分ごとの記録のたびに調べます。
# 注意 → 記録だけ / 置き直し → 新しいレンジに移す / 離脱 → その建玉を閉じる / 緊急離脱 → 全部閉じて新しく始めるのを止める
risk:
  fast_window_jst: "22:00-23:30"       # 米国市場の開場前後。この時間だけ fast_minutes ごとに記録を取って見張る
  fast_minutes: 5
  caution_edge_pct: 1.0                # 注意: レンジの端まで1%未満
  caution_reward_shortfall_pct: 40     # 注意: 報酬の実績が予測より40%以上少ない
  caution_min_hours: 2                 #   （報酬の比べっこは、始めて2時間たってから）
  rebalance_after_minutes: 15          # 置き直し: レンジの外に15分いた
  rebalance_min_net_pct: 0.0           #   置き直し先の純日利がこれ以下なら、置き直さずに離脱
  exit_reward_token_24h_pct: -20       # 離脱: 報酬トークンが24時間で−20%
  emergency_liquidity_drop_1h_pct: 50  # 緊急離脱: プールの流動性が1時間で−50%（ラグプルの兆候）
  emergency_daily_loss_pct: 5          # 緊急離脱: 今日の損が、総資産（建玉の投入額の合計）の5%に達した
  # 2026-09-29 オーナー決定
  exit_dump_1h_pct: -15                # 離脱（投げ売り）: 値動きする側のトークンがプール価格で1時間で−15%
  exit_dump_24h_pct: -30               #   または24時間で−30%
  emergency_usdg_below: 0.98           # 緊急離脱: USDG の外部の価格（GeckoTerminal）が $0.98 未満
  emergency_usdg_times: 2              #   が2回続いた
  caution_hedge_cost_pct: 50           # 注意: ヘッジの1日の費用が報酬の50%を超えた（記録だけ）
  contract_watch: true                 # 会場プログラムの停止・持ち主の変更・入れ替えを読み取りで見張る（変わったら緊急離脱）
  max_swap_slippage_pct: 1.0           # 離脱の両替: ずれが1%を超えるなら分けて売る
  max_gas_usd_per_tx: 1.0              # ふつうの離脱と置き直しは、ガス代（1回）がこれを超えたら見送る（緊急離脱は実行）
  # 実績の日利の見せ方（2026-09-29 オーナー指示）
  actual_min_hours: 6                  # 始めてから6時間未満は「参考（データ不足）」として小さく出す
  compare_min_hours: 24                # 24時間たってから「予測との比較」を出す

# リスク上限。エージェントは変更しません（変更はオーナーが手で行う）。
limits:
  position_usd: 1000
  total_usd: 3000
  per_venue_share: 0.5
  trades_per_day: 20
