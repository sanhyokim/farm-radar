[project]
name = "farm-radar"
version = "0.1.0"
description = "新興DEXのエミッション・ファーミング観察システム（読み取り専用）"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "eth-abi>=5.1",
  "eth-hash[pycryptodome]>=0.7",
  "pyyaml>=6.0",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["farm_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"farm_radar.db" = ["schema.sql"]
