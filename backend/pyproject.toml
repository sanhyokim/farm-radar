[project]
name = "farm-radar"
version = "0.1.0"
description = "新興DEXのエミッション・ファーミング観察システム（読み取り専用）"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "eth-abi>=5.1",
  "eth-hash[pycryptodome]>=0.7",
  "pyyaml>=6.0",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "tzdata>=2024.1",   # 米国市場の時間（ニューヨーク時間・夏時間）の計算用。Docker の slim イメージに無いことがあるため
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["farm_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["stage4: 段階4（もっと良い場所へ）を止めずに動かすテスト"]

[tool.setuptools.package-data]
"farm_radar.db" = ["schema.sql"]
"farm_radar.feeds" = ["schema.sql"]   # 一覧の保存（N2a）の表
