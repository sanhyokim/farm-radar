# チェーンの登録: Base（N1。SPEC 13.1 の5「詳しい計算は Robinhood Chain と Base から」）
# ルール: 推測で埋めない。出典（source_url）と確認日（checked_at）を書く。確かめられないものは unverified: true。
# まだ会場は登録していない（Base の会場の読み方は N3 で作る。会場の住所はそのときに公式の資料で確かめる）。

id: base
name: Base
family: evm                 # 系統: ETH系
chain_id: 8453
native_token: ETH
public_rpc: https://mainnet.base.org   # 公式の公開RPC（回数制限あり。公式は本番用途に専用のRPCを推奨）
alchemy_rpc: null                      # 未確認（使うときに Alchemy の公式資料で確かめてから書く）
explorer: https://basescan.org
unverified: false
source_url: https://docs.base.org/base-chain/quickstart/connecting-to-base
checked_at: "2026-10-02"
note: "公式の資料の値: Network Name Base Mainnet、Chain ID 8453、RPC https://mainnet.base.org、Currency ETH、Explorer https://basescan.org"

# コインの一覧（安定コイン・ヘッジ先）は、Base の会場を足すとき（N3）に venues/tokens-base.yaml として作る
tokens_file: null

# 値動きしないコイン（預かり証の中身の見分けに使う。2026-10-02 オーナー決定 SPEC 13.1 の5）。公式の資料で確かめたものだけ
stablecoins:
  USDC:
    address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
    source_url: https://developers.circle.com/stablecoins/usdc-contract-addresses
    checked_at: "2026-10-02"

# 契約の中身が公開・確認済みかを調べる Blockscout（公式の一覧は basescan だけ。Blockscout の住所は Blockscout の
# チェーン一覧 https://chains.blockscout.com/api/chains の chainId 8453 で確認。2026-10-02）
blockscout: https://base.blockscout.com

# 外の一覧での名前
geckoterminal_network: base        # https://api.geckoterminal.com/api/v2/networks で確認（2026-10-02）
defillama_name: Base               # https://api.llama.fi/v2/chains の name（chainId 8453。2026-10-02 確認）
defillama_coins_key: base         # https://coins.llama.fi の値段の名前（"base:<住所>"。2026-10-02 に USDC・WETH で確認）
lists_checked_at: "2026-10-02"     # Merkl・Across・Relay・LI.FI の一覧に chain_id 8453 があることを確認

# Uniswap の公式の住所（N3。幅に配るプールを読むときに、Merkl の書く住所がこれと同じか確かめる）。
# 出典: https://developers.uniswap.org/docs/protocols/v4/deployments 、
#       https://developers.uniswap.org/docs/protocols/v3/deployments/v3-base-deployments 、
#       https://developers.uniswap.org/deployments.json（id v4-poolmanager-base・v3-uniswapv3factory-base）、
#       https://raw.githubusercontent.com/Uniswap/contracts/main/deployments/json/8453.json 。
# Sourcify で契約の中身が公開・確認済み（PoolManager・PositionManager・UniswapV3Factory）。確認日 2026-10-02
uniswap:
  v4_pool_manager: "0x498581fF718922c3f8e6A244956aF099B2652b2b"
  v4_position_manager: "0x7C5f5A4bBd8fD63184577525326123B519429bDc"   # プールの組み合わせ（フック・tick の間隔）を poolKeys で読む
  v3_factory: "0x33128a8fC17869897dcE68Ed026d694621f6FDfD"
  source_url: https://developers.uniswap.org/deployments.json
  checked_at: "2026-10-02"
