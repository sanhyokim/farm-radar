# チェーンの登録: Robinhood Chain（N1。SPEC 13.4）
# ルール: 推測で埋めない。出典（source_url）と確認日（checked_at）を書く。確かめられないものは unverified: true。
# 会場のファイル（venues/*.yaml）は `chain: robinhood` でここを指す。チェーンを足すときは、同じ形のファイルを
# このフォルダーに置いて、config.yaml の chains に1行足すだけ。

id: robinhood
name: Robinhood Chain
family: evm                 # 系統: ETH系
chain_id: 4663
native_token: ETH
public_rpc: https://rpc.mainnet.chain.robinhood.com
# Alchemy のURL。{API_KEY} は .env の ALCHEMY_API_KEY で置き換えます。
alchemy_rpc: https://robinhood-mainnet.g.alchemy.com/v2/{API_KEY}
explorer: https://robinhoodchain.blockscout.com
unverified: false
source_url: https://docs.robinhood.com/chain/connecting
checked_at: "2026-09-27"
note: "公開RPCは回数制限あり。公式は本番用途に Alchemy などを推奨。"

# コインの一覧（安定コイン・株のトークン・ヘッジ先）。venues/ の中のファイル名
tokens_file: tokens-robinhood.yaml
# 契約の中身が公開・確認済みかを調べる Blockscout（公式の explorer と同じ。https://chains.blockscout.com/api/chains の
# chainId 4663 でも確認。2026-10-02）
blockscout: https://robinhoodchain.blockscout.com

# 外の一覧での名前（Merkl・送金サービスはチェーン番号 chain_id で書かれている）
geckoterminal_network: robinhood   # https://api.geckoterminal.com/api/v2/networks で確認（2026-09-29、2026-10-02 再確認）
defillama_name: Robinhood Chain    # https://api.llama.fi/v2/chains の name（chainId 4663。2026-10-02 確認）
defillama_coins_key: robinhood    # https://coins.llama.fi の値段の名前（"robinhood:<住所>"。2026-10-02 に USDe で確認）
lists_checked_at: "2026-10-02"     # Merkl・Across・Relay・LI.FI の一覧に chain_id 4663 があることを確認

# Uniswap の公式の住所（N3。幅に配るプールを読むときに、Merkl の書く住所がこれと同じか確かめる）。
# 出典: https://developers.uniswap.org/docs/protocols/v4/deployments 、
#       https://developers.uniswap.org/docs/protocols/v3/deployments/v3-robinhood-chain-deployments 、
#       https://developers.uniswap.org/deployments.json（id v4-poolmanager-robinhood-chain・v3-uniswapv3factory-robinhood-chain）、
#       https://raw.githubusercontent.com/Uniswap/contracts/main/deployments/json/4663.json 。
# Sourcify で契約の中身が公開・確認済み（PoolManager・PositionManager・UniswapV3Factory）。確認日 2026-10-02
uniswap:
  v4_pool_manager: "0x8366a39CC670B4001A1121B8F6A443A643e40951"
  v4_position_manager: "0x58daec3116aae6D93017bAAea7749052E8a04fA7"   # プールの組み合わせ（フック・tick の間隔）を poolKeys で読む
  v3_factory: "0x1f7d7550B1b028f7571E69A784071F0205FD2EfA"
  source_url: https://developers.uniswap.org/deployments.json
  checked_at: "2026-10-02"
