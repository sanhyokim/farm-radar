# Farm Radar（読み取り専用）。起動・停止の手順は README.md を見てください。
services:
  collector:            # 15分ごとにプールのデータを集める
    build: { context: ., dockerfile: backend/Dockerfile }
    command: python -m farm_radar.scheduler
    env_file:
      - path: .env
        required: false   # .env がなくても起動できる
    environment: { FARM_RADAR_ROOT: /app }
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./venues:/app/venues:ro
      - ./chains:/app/chains:ro      # チェーンの登録（N1）
      - ./data:/app/data
    restart: unless-stopped

  feeds:                # 一覧の保存（Merkl・DefiLlama・送金サービス・Aero のお知らせ。読み取りだけ。チェーンは読むだけ: 預かり証は1日1回、幅に配るプールは1時間に1回。SPEC 13.4）
    build: { context: ., dockerfile: backend/Dockerfile }
    command: python -m farm_radar.feeds.scheduler
    env_file:
      - path: .env
        required: false   # .env がなくても起動できる
    environment: { FARM_RADAR_ROOT: /app }
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./chains:/app/chains:ro      # チェーンの登録（N2b: コインの値段を読むチェーンを決める）
      - ./data:/app/data             # data/feeds.sqlite3 と data/feeds/（圧縮した元の応答）
    restart: unless-stopped

  api:                  # 画面とAPI（画面 http://localhost:18000 、状態 http://localhost:18000/api/health）
    build: { context: ., dockerfile: backend/Dockerfile }
    command: uvicorn farm_radar.api:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false   # .env がなくても起動できる
    environment: { FARM_RADAR_ROOT: /app }
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./venues:/app/venues:ro
      - ./chains:/app/chains:ro      # チェーンの登録（N1）
      - ./docs:/app/docs:ro          # 「学ぶ」タブのよくある質問（docs/faq.md）と予定とメモ・見送り中の会場（docs/plans.yaml）
      - ./data:/app/data
    ports:
      # 8000 はほかのアプリと重なりやすいので 18000 を使う。iPhone から見るときは .env で FARM_RADAR_BIND=0.0.0.0
      - "${FARM_RADAR_BIND:-127.0.0.1}:${FARM_RADAR_PORT:-18000}:8000"
    restart: unless-stopped
