# ルール: アドレスや仕組みは推測で埋めない。確認できたものだけ値を入れ、出典URLと確認日を書く。
#         確認できていないものは unverified: true のまま。UIに警告が出ます。
# 出典の優先順位: 1) Blockscout の検証済みコントラクトのソースコード 2) 公式ドキュメント / 公式GitHub
#   ※ 第三者ツール（例: labrinyang/lp-terminal）は照合用の参考にとどめ、出典には使わない。

