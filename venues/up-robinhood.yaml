# 確認方法（2026-09-27）
#  1) アドレスの出どころ: up. 公式サイト https://up33.xyz/ が読み込むプログラム
#     （/assets/index-Dv2RMzFm.js）の中の mainnet 設定（chainId 4663）。
#  2) ソースコード: Sourcify（コントラクト検証の公開データベース）で「チェーン上のバイトコードと一致」
#     と判定された検証済みソース。https://repo.sourcify.dev/4663/<アドレス>
#     ※ Blockscout の画面/API は Cloudflare の自動アクセス防止で、この作業環境からは読めなかった。
#       Blockscout の各アドレスのページで「verified」の表示をオーナーが目で確認できる（下の blockscout_url）。
#     照合の種類（sourcify_match）:
#       full    = 完全一致。ソースに加えて、コンパイル時の付加情報（メタデータのハッシュ）まで一致。
#       partial = 部分一致。実行されるプログラム（バイトコード）は一致するが、メタデータ（コメントや
#                 ファイル名など、動作に関係しない部分）が違う。動作の確認には十分だが、full より一段弱い。
#       none    = Sourcify に登録がなく、ソースを読めていない。
#     （Sourcify API の exact_match を full、match を partial と書いている。2026-09-27 に全件を再照会）
#  3) チェーン上の照合: 公開RPCで Voter.minter() / Voter.ve() / FactoryRegistry.factoriesToPoolFactory()
#     / CLPool.gauge() / Voter.gauges() などを呼び、アドレス同士のつながりが公式サイトの設定と一致することを確認。
# ---------------------------------------------------------------------------
