# 会場定義: up.（Robinhood Chain）
# ルール: アドレスや仕組みは推測で埋めない。確認できたものだけ値を入れ、出典URLと確認日を書く。
#         確認できていないものは unverified: true のまま。UIに警告が出ます。
# 出典の優先順位: 1) Blockscout の検証済みコントラクトのソースコード 2) 公式ドキュメント / 公式GitHub
#   ※ 第三者ツール（例: labrinyang/lp-terminal）は照合用の参考にとどめ、出典には使わない。

id: up-robinhood
name: "up."
type: ve33            # ve(3,3)型（ロックした人がボーナスの配り先を投票で決める）
website: https://up33.xyz/
audited: null         # 未確認（DefiLlama に監査情報なし。2026-09-27 確認）
launch_date: null     # 未確認

chain:
  id: robinhood
  chain_id: 4663
  native_token: ETH
  public_rpc: https://rpc.mainnet.chain.robinhood.com
  # Alchemy のURL。{API_KEY} は .env の ALCHEMY_API_KEY で置き換えます。
  alchemy_rpc: https://robinhood-mainnet.g.alchemy.com/v2/{API_KEY}
  explorer: https://robinhoodchain.blockscout.com
  unverified: false
  source_url: https://docs.robinhood.com/chain/connecting
  checked_at: "2026-09-27"
  note: "公開RPCは回数制限あり。公式は本番用途に Alchemy などを推奨。"

