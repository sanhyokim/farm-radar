# ---------------------------------------------------------------------------
# 報酬と手数料の仕組み（検証済みソースと、チェーン上の値で確認）
# ---------------------------------------------------------------------------
mechanics:
  staked_lp_receives_fees:        # ゲージにステークしたLPが取引手数料を受け取るか
    value: false                  # 受け取らない。ステーク分の手数料は投票者（veUP保有者）へ行く
    unverified: false
    evidence_contract: "CLPool (0x1172…9dc3) / CLGauge (0xb6ee…ccad)"
    evidence_function: >-
      CLPool.swap() → calculateFees()/splitFees(): 手数料のうちステーク分（stakedLiquidity/liquidity の割合）は
      gaugeFees に積まれ、LPの手数料（feeGrowthGlobal）には入らない。
      CLPool.collectFees()（onlyGauge）→ CLGauge._claimFees() → IReward(feesVotingReward).notifyRewardAmount():
      ゲージが集めた手数料は FeesVotingReward（投票者向けの報酬箱）へ送られる。CLGauge._notifyRewardAmount の前に毎回呼ばれる。
    unstaked_fee: 0.10            # ステークしていないLPも、自分の手数料の10%を取られてゲージ→投票者へ
    unstaked_fee_evidence: >-
      CLPool.applyUnstakedFees() と CLFactory.getUnstakedFee()（defaultUnstakedFee=100000 = 10%）。
      上位5プールで unstakedFee()=100000 をチェーン上で確認（ゲージが死んでいるプールは0%）
    source_url: https://repo.sourcify.dev/4663/0x11725976bf1f38c4ab78d1f480bc5883d70d9dc3
    checked_at: "2026-09-27"
  reward_proportional_to_staked_inrange_liquidity:   # 報酬が「レンジ内でステークされた流動性」に比例するか
    value: true
    unverified: false
    evidence_contract: "CLPool (0x1172…9dc3) / CLGauge (0xb6ee…ccad)"
    evidence_function: >-
      CLPool._updateRewardsGrowthGlobal(): 毎秒 rewardRate 分の報酬を stakedLiquidity（今の価格帯でステーク中の流動性）で割って
      rewardGrowthGlobalX128 に足す。stakedLiquidity は swap() で価格帯をまたぐたびに stakedLiquidityNet で増減する。
      CLGauge._earned(): (getRewardGrowthInside(tickLower,tickUpper) の増分) × 自分の liquidity。
      → 自分のレンジが今の価格を含む時間だけ、(自分の流動性 / レンジ内ステーク流動性の合計) の割合で受け取る。
    note_rollover: "レンジ内のステーク流動性が0の時間の報酬は rollover に貯まり、次のエポックに持ち越し（CLPool._updateRewardsGrowthGlobal, CLGauge._notifyRewardAmount）"
    source_url: https://repo.sourcify.dev/4663/0x11725976bf1f38c4ab78d1f480bc5883d70d9dc3
    checked_at: "2026-09-27"
  epoch:                          # ボーナス配分の切り替え周期
    length_seconds: 604800        # 7日
    flip_time_utc: "木曜 00:00 UTC（日本時間 木曜 09:00）"
    unverified: false
    evidence_contract: "ProtocolTimeLibrary（Voter と CLGauge の両方に同じ定数）"
    evidence_function: >-
      EPOCH_DURATION = 7 days, EPOCH_OFFSET = 0, epochStart(t) = t - (t % 7 days)（Unix時刻0は木曜 00:00 UTC）。
      VOTE_WINDOW = 1 hours（切り替え直後1時間は投票不可）。CLGauge._notifyRewardAmount: 次の切り替えまでの秒数で割って rewardRate を決める。
      チェーン上で Voter.epochStart(now)=1790208000（2026-09-24 木 00:00 UTC）、epochNext=1790812800 を確認
    source_url: https://repo.sourcify.dev/4663/0x7F749fDD351C1Ceed82d76d7699CB631Eb8332a7
    checked_at: "2026-09-27"
  gauge_emission_cap:             # 【独自の仕組み】ゲージごとの報酬に上限がかかり、超えた分は燃やされる
    value: true                   # capMode = Enforced（2）で有効
    unverified: true              # 上限の計算式が、ソース非公開の GaugeCapController にあるため
    owner_acknowledged: "2026-09-27"   # オーナーが「未確認のまま、C4の警告を出して進める」と承認
    handling: "報酬は票の割合から計算せず、ゲージの実際の rewardRate を毎回読んで使う。エポック途中で30%以上減ったら通知する"
    evidence_contract: "Voter (0x7F74…32a7)"
    evidence_function: >-
      Voter._distribute() → _distributeEnforced(): 投票で決まる本来の配分（nominal）のうち、
      GaugeCapController.quote（WETH建ての価格などを使う）や管理者設定の上限で許された分だけゲージに渡す。
      残り（withheld）は Voter._settleExpiredEpochs() でエポック終了時に burnFrom（焼却）。
      今エポック（2026-09-24〜）の GaugeCapAccounted イベント77件の合計: 本来 約13,439,163 UP → 実際に配布 約1,308,540 UP（約9.7%）。
    formula_impact: "票の割合 × 週の発行量 では実際の報酬を大きく過大評価する。実際にゲージへ渡った量（CLGauge.rewardRate）を使う必要がある"
    source_url: https://repo.sourcify.dev/4663/0x7F749fDD351C1Ceed82d76d7699CB631Eb8332a7
    checked_at: "2026-09-27"

