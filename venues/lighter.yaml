# Lighter（perp のヘッジ先）の確認済みの事実。スコア計算のヘッジ費用（SPEC 3.2章 5.）の根拠。
# 株トークン・WETH と Lighter の市場の対応は venues/tokens-robinhood.yaml の perps にある。
id: lighter
name: Lighter
api_base: https://mainnet.zklighter.elliot.ai/api/v1

fees:
  # 取引手数料。config.yaml の scoring.hedge.taker_fee_pct（今は 0.0）の根拠
  standard_account:
    maker_pct: 0.0
    taker_pct: 0.0
    note: 標準アカウント（初期設定）は perp も現物も手数料なし。注文の反映に少し待ち時間がある（テイカー 300ms）
  premium_account_reference:
    # 参考: 手数料ありのアカウント（自分で切り替えたときだけ）。LIT をステークしていない場合
    maker_pct: 0.0040
    taker_pct: 0.0280
  sources:
    - url: https://docs.lighter.xyz/trading/trading-fees
      checked_at: '2026-09-29'
      quote: "Lighter currently charges no maker or taker fees for Standard Accounts ... Fees: 0 maker / 0 taker"
    - url: https://mainnet.zklighter.elliot.ai/api/v1/orderBookDetails
      checked_at: '2026-09-29'
      quote: 対応表にある29市場（ETH と株の perp）すべてで taker_fee "0.0000" / maker_fee "0.0000"
  caution: >-
    公式ドキュメントに「currently（今のところ）」とあるので、将来変わる可能性がある。
    手数料が有料になったら config.yaml の scoring.hedge.taker_fee_pct を変える。

funding:
  # 資金調達率（ヘッジ費用の大部分）。M2 で確認済み（2026-09-28）
  interval: 1時間ごと
  api: fundings の rate は「1時間あたりの%」、direction は支払う側
  sources:
    - url: https://docs.lighter.xyz/trading/funding
      checked_at: '2026-09-28'

  # N2b（機会の一覧）で使う今の資金調達率の一覧（2026-10-02 確認）
  snapshot_api: /api/v1/funding-rates
  snapshot_units: >-
    exchange が "lighter" の行の rate は「8時間あたりの割合」（ほかの取引所の行も入っているので使わない）。
    プラス = 買いが払う・売りが受け取る。保険（売り）の1日の費用 = −rate × 3。受け取りは収入に数えない（安全側）。
  snapshot_sources:
    - url: https://mainnet.zklighter.elliot.ai/api/v1/funding-rates
      checked_at: '2026-10-02'
      quote: 同じ銘柄の /api/v1/fundings の direction（支払う側）と符号を照らして、プラス = 買いが払う、を確認

margin:
  # 保険の預け金の自動計算（2026-10-02 オーナー決定「自動で計算」。backend/farm_radar/opportunities.py の margin_need）
  api: /api/v1/orderBookDetails の default_initial_margin_fraction（最初に要る割合）と maintenance_margin_fraction（維持の割合）
  units: 応答の値 ÷ 10000 が割合（例 500 は 5%）
  rule: >-
    担保が「建玉の額 × 維持の割合」を下回ると、一部を強制的に閉じられる。
    値段が u 上がっても耐える預け金 = 売りの額 × max(最初に要る割合, u ＋ (1 ＋ u) × 維持の割合)。u は config.yaml の
    opportunities.hedge_withstand_rise_pct（今は 50%。仮）。
  sources:
    - url: https://docs.lighter.xyz/trading/contract-specifications
      checked_at: '2026-10-02'
      quote: 表の CRV は IMR 10% / MMR 6%。API の CRV は default_initial_margin_fraction 1000 / maintenance_margin_fraction 600
    - url: https://docs.lighter.xyz/trading/liquidations-and-llp-insurance-fund
      checked_at: '2026-10-02'
      quote: Maintenance Margin Requirement を下回ると一部の強制決済が始まる
  # 練習（paper）とスコアも 2026-10-03 から同じ式（execution/hedge_guard.py の margin_need・split。前は総額の40%決め打ち）
  minimums:
    # 最低の預け金と、1回の注文の最小額（2026-10-03 オーナーの質問「Lighter の最低の預け金はいくらか」）
    deposit_usd: {ethereum_mainnet: 1, other_evm_cctp: 5, first_deposit_new_account: 5, existing_account_uda: 3}
    withdraw_usd: {secure: 1, fast_usdc_only: 4}
    order_min_quote_usd: 10       # /api/v1/orderBookDetails の min_quote_amount（ETH・NVDA・SPY とも 10.000000）
  minimums_sources:
    - url: https://apidocs.lighter.xyz/docs/deposits-transfers-and-withdrawals
      checked_at: '2026-10-03'
      quote: Ethereum mainnet "1 USDC, or equivalent, minimum per deposit"。CCTP（Arbitrum・Base など）"Minimum deposit is 5 USDC"。
        新しい口座の最初の預け入れは $5、今ある口座は $3（EVM・Solana）。引き出しは 1 USDC（速い引き出しは 4 USDC）
    - url: https://mainnet.zklighter.elliot.ai/api/v1/orderBookDetails
      checked_at: '2026-10-02'
      quote: min_quote_amount "10.000000"（ETH・NVDA・SPY）。ETH は最初に要る割合 500・維持の割合 120（5%・1.2%）

account:
  # 担保の残高と建玉の読み取り（SPEC 5.2.1章。読み取りのみ。backend/farm_radar/hedges/lighter.py）
  api: /api/v1/account?by=l1_address&value=<アドレス>
  fields: collateral（担保）、available_balance（使える残高）、positions（建玉。position・sign・position_value）
  sources:
    - url: https://apidocs.lighter.xyz/
      checked_at: '2026-09-29'
    - url: https://mainnet.zklighter.elliot.ai/api/v1/account?by=index&value=1
      checked_at: '2026-09-29'
      quote: 公開 API の応答で collateral・available_balance・positions の形を確認。見つからないアドレスは code 21100 "account not found"
  unverified:
    - 建玉（positions）がある口座の応答の形（sign が売り=-1 か）は、建玉のある口座で未確認

robinhood_chain:
  # Lighter の Robinhood Chain 版（別の取引所。2026-10-04 オーナー決定 ②A: この版にある市場は、こちらで保険をかける方針。
  # ほかの市場と Base のプールは本体）。今は読むだけ。お金を動かすコード・署名・鍵はない（Phase 3a まで作らない）
  api_base: https://api.rh.lighter.xyz/api/v1
  collateral: USDG（Robinhood Chain のドルのコイン。本体は USDC）
  separate_from_mainnet: '口座・残高・鍵・市場の番号は本体と別（例: NVDA は本体 110、この版 15）'
  contract_unverified_here:
    # 預け入れの契約の住所は公式の説明に書かれているが、このアプリは使わない（お金を動かさない）ので、Blockscout・Sourcify では確かめていない
    address: "0x94bAB9693Ba2f6358507eFfcbd372b0660AFfF9d"
    unverified: true
    source_url: https://apidocs.lighter.xyz/docs/lighter-rh
    checked_at: '2026-10-04'
  read:
    markets: /orderBookDetails（1時間に1回。status・maintenance_margin_fraction・default_initial_margin_fraction・min_initial_margin_fraction・mark_price）
    funding: '/funding-rates の exchange=lighter（1時間に1回。本体と同じ単位: 8時間あたり、プラス = 買いが払う）'
    history: /fundings・/candles（1日1回。up. の保険の市場のうち、この版にあるものだけ。最初は90日分）
  units: >-
    割合の欄は本体と同じ（÷10000）。default_initial_margin_fraction はこの版ではどの市場も 5000（50%。最初の倍率の決まりの値とみられる）、
    min_initial_margin_fraction は本体と同じ形（ETH 200 = 2%）。預け金の式は「耐える上げ u（50% 以上）＋ (1+u) × 維持の割合」が
    いつも大きいので、最初に要る割合の違いで預け金は変わらない
  differences_seen:
    # 2026-10-04 作業場所で読んだ値（Lighter の公開の記録）。保険に使う29市場のうち18市場がこの版にある
    on_rh: [AAPL, AMD, AMZN, COIN, CRCL, ETH, GOOGL, INTC, META, MSFT, MU, NVDA, ORCL, QQQ, SNDK, SPCX, SPY, TSLA]
    not_on_rh: [ASML, CBRS, DELL, EWY, IBM, MRNA, MRVL, MSTR, NBIS, NOW, RKLB]
    maintenance_margin: SNDK・MU はこの版 6%（本体 3%）、QQQ はこの版 1.2%（本体 1.99%）。ほかの15市場は同じ
  sources:
    - url: https://apidocs.lighter.xyz/docs/lighter-rh
      checked_at: '2026-10-04'
      quote: Lighter on Robinhood Chain は別の取引所。預け金は USDG。口座・残高・鍵・番号は本体と共有されない
    - url: https://docs.robinhood.com/chain/lighter-domains
      checked_at: '2026-10-04'
      quote: own contracts, sequencer, blockspace, and liquidity（Lighter Core とは別）
    - url: https://api.rh.lighter.xyz/api/v1/orderBookDetails
      checked_at: '2026-10-04'
      quote: perp 58 市場。手数料 0%。ETH の maintenance_margin_fraction 120（1.2%）
