# 収集の設定（このアダプター用）
# ---------------------------------------------------------------------------
collection:
  snapshot_scope: gauged     # ゲージのある CL プールだけ（今は62個すべてにゲージがある）
  pool_types: [cl]           # 従来型（v2）の2プールは対象外
  log_chunk_blocks: 2000000  # NotifyReward を読むときの1回あたりのブロック幅（公開RPCは アドレス1つ＋トピック1つ なら 5,000,000 まで通った）
