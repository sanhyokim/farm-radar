# 会場定義: Alandale（Robinhood Chain）。M6 で追加した2つ目の会場（観察だけ）
# ルール: アドレスや仕組みは推測で埋めない。確認できたものだけ値を入れ、出典URLと確認日を書く。
#         確認できていないものは unverified: true のまま。UIに警告が出ます。
# 調査の記録: /mnt/project-files/farm-radar/research/alandale-onchain-2026-09-29.md と alandale-m6-2026-09-30.md
#   （読み取りだけ。トランザクションの送信・署名はしていない）

id: alandale-robinhood
name: "Alandale"
type: ve33            # ve(3,3)型（LUTE をロックした人がボーナスの配り先を投票で決める）
# 仕組みの型（N1。backend/farm_radar/registry.py の MECHANISMS）。根拠は下の mechanics:
#  range       = 週の量をレンジ内の流動性 × 時間で分ける（reward_split_offchain。計算は運営のサーバー）
#  vote_weekly = 今週の投票で来週のプールごとの量が決まる（epoch）
mechanisms: [range, vote_weekly]
# 読み方の名前（N1。backend/farm_radar/adapters/registry.py の READERS）。Algebra の集中流動性と、週の量を配る GaugeRewarder を読む
reader: algebra_weekly_rewarder
website: https://alandale.xyz/
audited: null         # 未確認（公式文書 reference/security.md に監査報告へのリンクは見つかっていない。2026-09-30）
launch_date: "2026-08-04"  # AlgebraFactory の作成日（ブロック 27,916,187 = 2026-08-04 20:36 UTC）。最初のプールはブロック 30,318,351

# 観察だけ（2026-09-30 オーナー条件1）。練習（仮想のお金）と2週間の評価には入れない
practice: false
practice_note_ja: >-
  Alandale は観察だけの会場です。判定は見られますが、練習（仮想のお金）と2週間の評価には入れていません。
  評価の対象は WETH/USDG と NVDA の2つのままです。

# プールのカードに出す「切り替えで来週ボーナスがなくなることがある」理由（2026-09-30 オーナー追加）
epoch_note_ja: >-
  Alandale では、プールごとの来週のボーナスの量を、今週の投票（LUTE をロックした人の票）で決めます。
  票が集まらなかったプールは、来週のボーナスが0になります（例: 2026-09-24〜の週は WETH-QUOTRON が0でした）。

# ボーナスの見込みに添える一言（2026-09-30 オーナー追加。SPEC 5.2.3章）。
# 一人ひとりへの分け方は運営のサーバーが決めて公開されていないので、「週の量を7日に均等に配る」と仮定して計算している
reward_estimate_note_ja: "推定（1週間を7日で均等に配ると仮定）"

# 外部の一覧サイトでのこの会場の名前（週1回の候補の一覧から、いま見ている会場を除くため。SPEC 5.2.2章）
listings:
  defillama: [alandale-v3, alandale-v2]      # https://api.llama.fi/protocols の slug（"Alandale V3" / "Alandale V2"）
  geckoterminal: [alandale-cl, alandale]     # https://api.geckoterminal.com/api/v2/networks/robinhood/dexes の id（CL / 従来型）
  checked_at: "2026-09-30"

# チェーン（N1）: chains/robinhood.yaml を指す。接続先・出典・確認日はそちらに書く
chain: robinhood

