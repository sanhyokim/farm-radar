# ---------------------------------------------------------------------------
# 報酬と手数料の仕組み（検証済みソース・公式文書・チェーン上の値で確認）
# ---------------------------------------------------------------------------
mechanics:
  epoch:                          # ボーナス配分の切り替え周期
    length_seconds: 604800        # 7日
    flip_time_utc: "木曜 00:00 UTC（日本時間 木曜 09:00）"
    unverified: false
    evidence_contract: "MinterUpgradeable（0x0206…722a, partial） / VoterUpgradeableV2（0x0D27…7d1b, partial）"
    evidence_function: >-
      Minter: WEEK = 86400 * 7（"reset every Thursday 00:00 UTC"）、update_period() で active_period = (block.timestamp / WEEK) * WEEK。
      Voter: _WEEK = 604800。active_period が新しい週に変わるのは、誰かが update_period()（Voter.distributeAll() の中）を呼んだとき
      （2026-09-24 の週は 00:01:07 UTC）。それまでは新しい週の量は 0 と読める
    source_url: https://repo.sourcify.dev/4663/0x0206e7b9680571e1442dfea804339e46e5be722a
    checked_at: "2026-09-30"
  lp_receives_swap_fees:          # CL の LP が取引手数料を受け取るか
    value: false                  # 受け取らない。手数料は100%が金庫へ（98.5% 投票者 / 1.5% 別のアドレス）
    unverified: false
    evidence_contract: "AlgebraPool（0x7a35…1df0, partial）"
    evidence_function: >-
      SwapCalculation.sol: delta = feeAmount × communityFee / 1000 を LP の手数料の伸び（totalFeeGrowth）から先に引く。
      全62プールで globalState().communityFee = 1000（= 100%）、AlgebraFactory.defaultCommunityFee() = 1000。
      WETH-USDG で約14分あけて読み、getCommunityFeePending() は増え、totalFeeGrowth0/1Token() は変わらないことを確認。
      金庫から先は getDistributionConfig = (9850, [0x6cbd…6e76], [150])（98.5% ゲージ→投票者、1.5% EOA）
    source_url: https://repo.sourcify.dev/4663/0x7a35168956f129c032ec035cc47383a605a71df0
    checked_at: "2026-09-30"
  staking_required:               # ボーナスを受け取るのにゲージへのステークが要るか
    value: false                  # 要らない。レンジ内に置くだけ
    unverified: false
    evidence_function: >-
      公式文書 providing-liquidity/cl-emissions.md "There is no stake your NFT into a gauge step" / "You don't stake anything"。
      全62ゲージの totalSupply() = 0
    source_url: https://alandale.gitbook.io/alandale/providing-liquidity/cl-emissions.md
    checked_at: "2026-09-30"
  pool_weekly_reward_onchain:     # プールごとの週のボーナスの量がチェーンで読めるか
    value: true
    unverified: false
    evidence_contract: "GaugeRewarder（0x6D8e…fcf, partial）"
    evidence_function: >-
      rewardPerGaugePerEpoch(Minter.active_period(), Voter.poolToGauge(pool))。全62ゲージの合計が rewardPerEpoch(1790208000) = 10,104,401.88 LUTE と一致。
      Voter の票からの計算（weightsPerEpoch × index の差）と、手で足した分を除いて一致（2026-09-29 の調査）
    source_url: https://repo.sourcify.dev/4663/0x6D8ec9f879Fe837Ebb701d35859fD00fd58EfFcf
    checked_at: "2026-09-30"
  manual_top_ups:                 # 運営が特定のプールに手でボーナスを足せるか
    value: true
    unverified: false
    evidence_function: >-
      GaugeRewarder の REWARDER_ROLE（getRoleMember: 0xfaa6…91f3、0xfb86…6b4 の Safe）が notifyReward で足せる。
      NotifyReward の caller がゲージ自身なら「いつもの分」、それ以外なら「手で足した分」として分ける。
      例: 2026-09-18 に SPY-USDG へ 150,000 LUTE（caller = Safe 0xfb86…6b4）。2026-09-24 の週は手で足した分なし（58件すべてゲージから）
    source_url: https://repo.sourcify.dev/4663/0x6D8ec9f879Fe837Ebb701d35859fD00fd58EfFcf
    checked_at: "2026-09-30"
  reward_split_offchain:          # プールの週の量を LP 一人ひとりにどう分けるか
    value: "レンジ内の流動性 × 時間の割合で分ける（公式文書）。計算は運営のサーバー。Farm Radar は週の量を7日に均等に配る前提で計算する"
    unverified: true              # チェーンでは確かめられない（運営のサーバーの署名を信じるしかない）
    owner_acknowledged: "2026-09-30 オーナー条件3（分け方が運営のサーバーで決まる前提で、警告を付けて最高🟡で観察する）"
    unknowns_ja: >-
      7日に均等に配るか / 誰もレンジ内にいない時間の分がどうなるか / 公式の NFT 以外（自動運用の金庫）のポジションを数えるか /
      最低の保有時間 / 流動性の測り方と時間の刻み / 手で足した分をどの期間で配るか。いずれも文書にもコードにもない
    evidence_function: >-
      公式文書 cl-emissions.md "computes each LP's share of its weekly emission from how much in-range liquidity you provided, and for how long" /
      "Daily, the engine signs each LP's cumulative lifetime total" / "Out-of-range liquidity earns nothing"。
      GaugeRewarder._claim は signer()（0x9fd7…b115）の EIP-712 署名を確かめて払うだけ
    source_url: https://alandale.gitbook.io/alandale/providing-liquidity/cl-emissions.md
    checked_at: "2026-09-30"

# ---------------------------------------------------------------------------
# 会場の警告（SPEC 2章の条件ごと）。API（/api/venues）と画面に表示する。
# level: major（重大。判定は🔴） / minor（軽微。判定は🟡まで）
# ---------------------------------------------------------------------------
warnings:
  - code: C4
    key: offchain_reward_split
    level: minor          # 2026-09-30 オーナー条件3（up. の C4 と同じく軽微。判定は最高🟡）
    title_ja: "LPへの分け方は運営のサーバーが決める"
    message_ja: >-
      プールごとの週のボーナスの量はチェーンで読めますが、それを LP 一人ひとりにどう分けるかは、運営のサーバーが計算し、
      署名つきの請求で払います。チェーンでは確かめられません。7日に均等に配るかどうかも公開されていないので、
      Farm Radar は「7日に均等」と仮定して計算しています。主なコントラクトの多くは、運営が中身を差し替えられる作り（プロキシ）です。
    since: "2026-09-30"
  - code: C4
    key: manual_top_ups
    level: minor          # 2026-09-30 オーナー条件3
    title_ja: "運営が手でボーナスを足すことがある"
    message_ja: >-
      運営の共同管理の財布（5人中3人の署名で動く）が、特定のプールに手でボーナスを足すことがあります
      （例: 2026-09-18 に SPY-USDG へ 150,000 LUTE）。続く保証がないので、手で足された分は判定に入れず、プール詳細で分けて表示します。
    since: "2026-09-30"

